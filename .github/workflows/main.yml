name: AI-Agent

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Matches your backend Python version
        cache: 'pip'          # Caches pip packages to speed up subsequent runs

    # 3. Install required packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure testing and production server tools are explicitly present
        pip install pytest uvicorn fastapi

    # 4. Run your test suite
    - name: Run Tests with Pytest
      run: |
        pytest

    # 5. Verify Uvicorn can start the application cleanly
    - name: Verify Uvicorn Server Startup
      run: |
        echo "Starting Uvicorn in background to verify initialization..."
        # Run uvicorn in the background (&) using a 10-second timeout to verify it boots up without errors
        timeout 10s uvicorn main:app --host 127.0.0.1 --port 8000 || exec_status=$?
        
        # Timeout returns exit code 124 when it successfully terminates the command after the time limit
        if [ $exec_status -eq 124 ]; then
          echo "Uvicorn started and responded successfully within the timeout window."
          exit 0
        else
          echo "Uvicorn failed to start or crashed unexpectedly!"
          exit 1
        fi
